# Verba behind nginx — example server block.
# Include from /etc/nginx/sites-available/ and adjust server_name/TLS paths.
#
# Everything in Verba uses relative URLs, so no sub-path rewriting is needed.
# Two things matter: the WebSocket upgrade for /ws (live progress in the UI)
# and a body-size limit large enough for audio uploads.

server {
    listen 80;
    server_name verba.example.com;

    # Redirect to HTTPS in production (certbot adds this automatically):
    # return 301 https://$host$request_uri;

    # Audio uploads (UI upload and the public /v1 API) can be large.
    client_max_body_size 2g;

    # Long-running synchronous /v1 transcription requests must not time out.
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;

    location /ws {
        proxy_pass http://127.0.0.1:8710;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;   # WebSocket idle: client pings every 25 s
    }

    location / {
        proxy_pass http://127.0.0.1:8710;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# X-Forwarded-Proto is what tells Verba the browser is on https even though
# TLS ends here: the session cookie is marked Secure from it. uvicorn trusts
# the header from 127.0.0.1 only — if this proxy runs on another host, start
# Verba with FORWARDED_ALLOW_IPS=<proxy ip> (or set auth.cookie_secure to
# "always" in the settings).
