<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#131318" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#faf9fd" media="(prefers-color-scheme: light)">
  <title>Verba</title>
  <link rel="stylesheet" href="/styles.css">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icons/icon.svg" type="image/svg+xml">
</head>
<body>
  <header class="top-bar">
    <img class="top-bar-logo" src="/icons/icon.svg" alt="" width="28" height="28">
    <span id="page-title" class="top-bar-title">Verba</span>
    <span class="spacer"></span>
    <span id="engine-status" class="engine-status"></span>
    <span id="ws-indicator" class="dot offline"></span>
        <button id="shutdown" class="text-btn top-bar-shutdown" type="button" hidden
          data-i18n="app.shutdown">Beenden</button>
  </header>

  <nav class="nav-bar" id="main-nav" aria-label="Hauptnavigation">
    <a href="#/" data-route="dashboard" class="nav-item">

      <span class="nav-label" data-i18n="nav.projects">Transkripte</span>
    </a>
    <a href="#/types" data-route="types" class="nav-item">
      <span class="nav-icon"><svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor"><path d="M12 2 6.5 11h11L12 2zm5.5 20a4.5 4.5 0 1 0 0-9 4.5 4.5 0 0 0 0 9zM3 13.5h8v8H3v-8z"/></svg></span>
      <span class="nav-label" data-i18n="nav.types">Typen</span>
    </a>
    <a href="#/search" data-route="search" class="nav-item">
      <span class="nav-icon"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="6.5"/><line x1="16.5" y1="16.5" x2="21" y2="21"/></svg></span>
      <span class="nav-label" data-i18n="nav.search">Suche</span>
    </a>
    <a href="#/settings" data-route="settings" class="nav-item">
      <span class="nav-icon"><svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor"><path d="M19.4 13a7.6 7.6 0 0 0 .06-1 7.6 7.6 0 0 0-.06-1l2.1-1.6a.5.5 0 0 0 .12-.65l-2-3.46a.5.5 0 0 0-.6-.22l-2.5 1a7.7 7.7 0 0 0-1.7-1l-.38-2.65A.5.5 0 0 0 13.95 2h-3.9a.5.5 0 0 0-.5.42L9.18 5.07a7.7 7.7 0 0 0-1.7 1l-2.5-1a.5.5 0 0 0-.6.22l-2 3.46a.5.5 0 0 0 .12.65L4.6 11a7.6 7.6 0 0 0 0 2l-2.1 1.6a.5.5 0 0 0-.12.65l2 3.46c.13.22.39.31.6.22l2.5-1a7.7 7.7 0 0 0 1.7 1l.37 2.65c.04.24.25.42.5.42h3.9a.5.5 0 0 0 .5-.42l.37-2.65a7.7 7.7 0 0 0 1.7-1l2.5 1c.22.09.48 0 .6-.22l2-3.46a.5.5 0 0 0-.12-.65L19.4 13zM12 15.5A3.5 3.5 0 1 1 12 8.5a3.5 3.5 0 0 1 0 7z"/></svg></span>
      <span class="nav-label" data-i18n="nav.settings">Einstellungen</span>
    </a>
  </nav>

  <main id="view" class="view"></main>

  <button id="fab" class="fab" hidden aria-label="Aktion">
    <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>

  <script type="module" src="/js/app.js"></script>
