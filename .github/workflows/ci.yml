# Quality gate: ruff + pytest on every push and pull request.
name: CI

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/*.txt

      - name: Install dependencies
        run: python -m pip install -r requirements/core.txt -r requirements/dev.txt

      - name: Ruff (lint)
        run: python -m ruff check backend/ tests/ run.py

      - name: Ruff (format)
        run: python -m ruff format --check backend/ tests/ run.py

      - name: Pytest
        run: python -m pytest tests/ -q
